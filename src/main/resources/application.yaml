server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/platformdb?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
    username: root
    password: 326944
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: paltform
    password: 326944
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
          max-retries: 2
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sinka.platform.entity
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    com.sinka.platform.mapper: DEBUG